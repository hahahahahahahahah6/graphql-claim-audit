[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphql-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented query-interface capabilities"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
graphql-claim-audit = "graphql_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["graphql_claim_audit*"]
